# The one Rust this repository builds, tests, lints, measures and releases with (#97). rustup
# reads this file, so every CI job and your local `cargo` use the same toolchain.
#
# Two jobs deliberately use another: `msrv` runs Cargo.toml's `rust-version` (the oldest Rust
# we promise to build on), and `fuzz` runs its pinned nightly. Nothing else names a version;
# .github/ci/check-workflows.sh enforces that.
#
# To move to a newer Rust, change `channel` in a PR and fix whatever it reports (clippy's new
# lints, coverage's line counting).
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
profile = "minimal"
