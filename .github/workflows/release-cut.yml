name: release-cut

# Merges the open release PR once nothing has changed it for QUIET_HOURS and its checks
# pass, so a burst of merges becomes one release. Merge the release PR yourself any time to
# release sooner, or run this workflow with quiet_hours = 0.

on:
  schedule:
    - cron: "23 * * * *" # hourly
  workflow_dispatch:
    inputs:
      quiet_hours:
        description: hours the release PR must sit unchanged (0 = release now if checks pass)
        default: "6"

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge, and tag the merge commit
      pull-requests: write
      actions: write # start release.yml
    env:
      GH_TOKEN: ${{ github.token }}
      QUIET_HOURS: ${{ inputs.quiet_hours || '6' }}
      REPO: ${{ github.repository }}
    steps:
      - name: merge the release PR if it has been quiet, then start the release
        run: |
          pr=$(gh pr list -R "$REPO" --state open --base main --json number,headRefName,headRefOid \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))] | first // empty')
          [[ -n "$pr" ]] || { echo "no release PR open"; exit 0; }
          number=$(jq -r .number <<<"$pr"); head=$(jq -r .headRefOid <<<"$pr")
          changed=$(gh api "repos/$REPO/commits/$head" --jq .commit.committer.date)
          quiet=$(( ($(date +%s) - $(date -d "$changed" +%s)) / 60 ))
          echo "release PR #$number last changed $changed ($quiet min ago)"
          (( quiet >= QUIET_HOURS * 60 )) || { echo "not quiet for ${QUIET_HOURS}h yet"; exit 0; }
          view=$(gh pr view "$number" -R "$REPO" --json mergeable,statusCheckRollup)
          [[ "$(jq -r .mergeable <<<"$view")" == MERGEABLE ]] || { echo "::warning::release PR #$number isn't mergeable"; exit 0; }
          total=$(jq '.statusCheckRollup | length' <<<"$view")
          bad=$(jq '[.statusCheckRollup[] | (.conclusion // .state // "") | select(IN("SUCCESS","SKIPPED","NEUTRAL") | not)] | length' <<<"$view")
          (( total > 0 && bad == 0 )) || { echo "checks not green yet ($bad of $total pending or failing)"; exit 0; }

          gh pr merge "$number" -R "$REPO" --squash --match-head-commit "$head"
          sha=$(gh pr view "$number" -R "$REPO" --json mergeCommit -q .mergeCommit.oid)
          version=$(gh api "repos/$REPO/contents/Cargo.toml?ref=$sha" -q .content | base64 -d |
            sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          [[ -n "$sha" && -n "$version" ]] || { echo "::error::merged #$number but couldn't read its commit/version"; exit 1; }
          # The bot's merge doesn't trigger release.yml, so tag the exact merge commit and
          # dispatch the release on that tag: it builds that commit and nothing later.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/v$version" -f sha="$sha" -q .ref
          gh workflow run release.yml -R "$REPO" --ref "v$version"
          echo "### merged #$number after ${quiet} quiet minutes; releasing v$version from $sha" >>"$GITHUB_STEP_SUMMARY"
