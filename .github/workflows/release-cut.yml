name: release-cut

# Merges the open release PR once nothing has changed it for QUIET_HOURS and its checks
# pass, so a burst of merges becomes one release. Merge the release PR yourself any time to
# release sooner, or run this workflow with quiet_hours = 0.

on:
  schedule:
    - cron: "23 * * * *" # hourly
  workflow_dispatch:
    inputs:
      quiet_hours:
        description: hours the release PR must sit unchanged (0 = release now if checks pass)
        default: "6"
      check_tagger:
        description: only check that the release-tagger App's token works (changes nothing)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    if: github.repository_owner == 'scottschreckengaust' && !inputs.check_tagger
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge
      pull-requests: write
    outputs:
      sha: ${{ steps.cut.outputs.sha }}
      version: ${{ steps.cut.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      QUIET_HOURS: ${{ inputs.quiet_hours || '6' }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release
      - id: cut
        name: merge the release PR if it has been quiet
        run: |
          pr=$(gh pr list -R "$REPO" --state open --base main --json number,headRefName,headRefOid \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))] | first // empty')
          [[ -n "$pr" ]] || { echo "::notice::no release PR open"; exit 0; }
          number=$(jq -r .number <<<"$pr"); head=$(jq -r .headRefOid <<<"$pr")
          changed=$(gh api "repos/$REPO/commits/$head" --jq .commit.committer.date)
          quiet=$(( ($(date +%s) - $(date -d "$changed" +%s)) / 60 ))
          echo "::notice::release PR #$number last changed $changed ($quiet min ago)"
          (( quiet >= QUIET_HOURS * 60 )) || { echo "::notice::not quiet for ${QUIET_HOURS}h yet"; exit 0; }
          mergeable=$(gh pr view "$number" -R "$REPO" --json mergeable -q .mergeable)
          [[ "$mergeable" == MERGEABLE ]] || { echo "::warning::release PR #$number isn't mergeable ($mergeable)"; exit 0; }
          # Read the head commit's check runs directly: the PR's status rollup leaves out the CI
          # that release-plz dispatches (bot-made PRs don't trigger CI on their own).
          runs=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" \
            --jq '[.check_runs[] | {name, status, conclusion}]')
          total=$(jq length <<<"$runs")
          bad=$(jq '[.[] | select(.status != "completed" or (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")
          if ! (( total > 0 && bad == 0 )); then
            echo "::notice::checks not green yet ($bad of $total pending or failing): $(jq -c . <<<"$runs")"
            exit 0
          fi

          # Last look before merging: the version it cuts must be new everywhere. This token can
          # see draft releases too.
          cargo=$(gh api "repos/$REPO/contents/Cargo.toml?ref=$head" -q .content | base64 -d)
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' <<<"$cargo" | head -1)
          next=$(sed -n 's/^version = "\(.*\)"/\1/p' <<<"$cargo" | head -1)
          if ! .github/release/version-is-new.sh "$name" "$next"; then
            echo "::error::release PR #$number would cut $name $next, which already exists; not merging"
            exit 1
          fi

          gh pr merge "$number" -R "$REPO" --squash --match-head-commit "$head"
          sha=$(gh pr view "$number" -R "$REPO" --json mergeCommit -q .mergeCommit.oid)
          version=$(gh api "repos/$REPO/contents/Cargo.toml?ref=$sha" -q .content | base64 -d |
            sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          [[ -n "$sha" && -n "$version" ]] || { echo "::error::merged #$number but couldn't read its commit/version"; exit 1; }
          { echo "sha=$sha"; echo "version=$version"; } >>"$GITHUB_OUTPUT"
          echo "### merged #$number after ${quiet} quiet minutes: v$version at $sha" >>"$GITHUB_STEP_SUMMARY"

  # The bot's merge doesn't trigger release.yml, so tag the exact merge commit and start the
  # release on that tag: it builds that commit and nothing merged later. Only the
  # release-tagger App may create v* tags, and its key only exists in the `release`
  # environment, which only deploys from main and v* tags.
  tag:
    needs: cut
    if: needs.cut.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write # start release.yml
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ needs.cut.outputs.sha }}
      TAG: v${{ needs.cut.outputs.version }}
    steps:
      - id: tagger
        name: release-tagger token (the only identity allowed to create v* tags)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}
          permission-contents: write
      - name: tag the merge commit
        env:
          GH_TOKEN: ${{ steps.tagger.outputs.token }}
        run: |
          if sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" -q .object.sha 2>/dev/null); then
            [[ "$sha" == "$SHA" ]] || { echo "::error::$TAG exists at $sha, not $SHA"; exit 1; }
            echo "$TAG already points at $SHA"
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" -q .ref
          fi
      - name: start the release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml -R "$REPO" --ref "$TAG"
          echo "### releasing $TAG from $SHA" >>"$GITHUB_STEP_SUMMARY"

  # Run this workflow with check_tagger ticked (from main) to confirm the App, its key and the
  # environment are wired up before a real release depends on them.
  tagger-check:
    if: inputs.check_tagger
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - id: tagger
        name: release-tagger token (the only identity allowed to create v* tags)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}
          permission-contents: write
      - name: the token can see this repository
        env:
          GH_TOKEN: ${{ steps.tagger.outputs.token }}
        run: |
          name=$(gh api "repos/$GITHUB_REPOSITORY" -q .full_name)
          echo "::notice::release-tagger token works for $name (contents: write); ready to create v* tags"
