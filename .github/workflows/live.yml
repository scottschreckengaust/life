name: live

# Actions -> live -> Run workflow. The report lands in the run summary.
permissions: {}

on:
  workflow_dispatch:
    inputs:
      preset:
        description: whose life
        type: choice
        default: scott
        options: [scott, parent, agent]
      scenario:
        description: which scenario (blank = the preset's default; `spin-life list -p NAME` lists them)
        default: ""
      speed_up:
        description: times faster than real life (3600 = an hour per second, 0 = instant)
        default: "0"

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  live:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: live
        env:
          PRESET: ${{ inputs.preset }}
          SCENARIO: ${{ inputs.scenario }}
          SPEED_UP: ${{ inputs.speed_up }}
        run: |
          cargo build --release -q
          args=(run)
          [ -n "$SCENARIO" ] && args+=("$SCENARIO")
          args+=(--preset "$PRESET")
          if [ "$SPEED_UP" = "0" ]; then args+=(--instant); else args+=(--speed-up "$SPEED_UP"); fi
          ./target/release/spin-life "${args[@]}" | tee life.txt
          { echo '```text'; cat life.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
