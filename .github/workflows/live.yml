name: live

# Actions -> live -> Run workflow, pick a life. The report lands in the run summary.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: which life to live
        type: choice
        default: week
        options: [happy-path, week, coffee, party, special-event, dawn-patrol, big-wave, late-night, early-flight, deadline, chaos]
      scale:
        description: seconds per simulated hour (0 = instant)
        default: "0"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: live
        env:
          SCENARIO: ${{ inputs.scenario }}
          SCALE: ${{ inputs.scale }}
        run: |
          cargo build --release -q
          if [ "$SCALE" = "0" ]; then pace="--instant"; else pace="--scale $SCALE"; fi
          ./target/release/life "$SCENARIO" $pace | tee life.txt
          { echo '```text'; cat life.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
