name: live

# Actions -> live -> Run workflow. The report lands in the run summary.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      preset:
        description: whose life
        type: choice
        default: scott
        options: [scott, parent, agent]
      scenario:
        description: which scenario (blank = the preset's default; `spin-life list -p NAME` lists them)
        default: ""
      scale:
        description: seconds per simulated hour (0 = instant)
        default: "0"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: live
        env:
          PRESET: ${{ inputs.preset }}
          SCENARIO: ${{ inputs.scenario }}
          SCALE: ${{ inputs.scale }}
        run: |
          cargo build --release -q
          if [ "$SCALE" = "0" ]; then pace="--instant"; else pace="--scale $SCALE"; fi
          ./target/release/spin-life run $SCENARIO --preset "$PRESET" $pace | tee life.txt
          { echo '```text'; cat life.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
