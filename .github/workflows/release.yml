name: release

# A version bump on main becomes a release, one gate at a time:
#
#   plan     Is Cargo.toml's version unreleased? (no *published* GitHub Release for it)
#   draft    Tag this exact commit, then a DRAFT GitHub Release on that tag, with the
#            CHANGELOG.md section as its notes. Tagging first means later merges to main
#            can't affect this release.
#   build    Binaries for 4 targets (static on Linux), each with a .sha256 and signed build provenance,
#            uploaded to the draft.
#   crate    The .crate file crates.io will receive, with a .sha256 and provenance.
#   test     On each OS, download the draft's assets (not the build outputs), verify the
#            checksum and provenance, then run the binary against tests/golden.
#   publish  cargo publish with crates.io trusted publishing, only after checking that the
#            bytes it uploads are the attested .crate.
#   verify   crates.io's index checksum and served .crate match the attested bytes,
#            provenance verifies on the downloaded file, and `cargo install` from
#            crates.io runs.
# It starts one of two ways: a human merges the release PR (a push to main), or release-cut
# merges it as github-actions[bot], tags the merge commit, and dispatches this workflow on
# that tag (pushes made with GITHUB_TOKEN don't trigger workflows; dispatches do).
#
#   release  Flip the draft to published, then start release-plz so merges that landed
#            during this release get their release PR.
#
# Every stage is safe to re-run: a version already on crates.io isn't published twice.
#
# On a release/** branch the same pipeline runs as a rehearsal: a real `rehearsal/...` tag
# (proving tag creation works), a throwaway prerelease draft, `cargo publish --dry-run`, no
# crates.io checks, and the tag and draft are deleted at the end.
#
# Actions are pinned to full commit SHAs; the comment names the release.

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  # Real releases (main or a v* tag) share one queue; each rehearsal branch has its own.
  group: release-${{ startsWith(github.ref, 'refs/heads/release/') && github.ref || 'real' }}
  cancel-in-progress: false

env:
  # One toolchain for packaging and publishing, so the .crate bytes are reproducible.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.plan.outputs.go }}
      published: ${{ steps.plan.outputs.published }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          REF: ${{ github.ref }}
          RUN: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(jq -r '.packages[0].name' <<<"$meta")
          version=$(jq -r '.packages[0].version' <<<"$meta")
          rehearsal=true; [[ "$REF" == refs/heads/main || "$REF" == refs/tags/v* ]] && rehearsal=false
          # A SemVer pre-release (0.2.0-rc.1, -beta.2, ...) ships as a GitHub prerelease, never "latest".
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          # Rehearsal tags live outside v* so the rule protecting v* tags doesn't stop cleanup.
          if $rehearsal; then tag="rehearsal/$version.$RUN.$ATTEMPT"; else tag="v$version"; fi
          go=true
          # Done means a *published* release. A tag, draft, or crates.io upload left by a
          # failed run is resumed instead (drafts aren't visible to this read-only token).
          if ! $rehearsal && [[ "$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" == false ]]; then
            echo "::notice::$tag is already released"
            go=false
          fi
          if ! $rehearsal && sha=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" | cut -f1) && [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "::warning::$tag already points at $sha, not $GITHUB_SHA; bump the version"
            go=false
          fi
          index="https://index.crates.io/${name:0:2}/${name:2:2}/$name"
          published=false
          if curl -fsS "$index" 2>/dev/null | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            published=true
            echo "::notice::$name $version is already on crates.io; publish will be skipped"
          fi
          $go || echo "::notice::nothing to release: the next release PR will bump the version"
          { echo "go=$go"; echo "published=$published"; echo "prerelease=$prerelease"; echo "name=$name"; echo "version=$version"; echo "tag=$tag"; echo "rehearsal=$rehearsal"; } >>"$GITHUB_OUTPUT"
          echo "### $tag (rehearsal: $rehearsal, prerelease: $prerelease, go: $go)" >>"$GITHUB_STEP_SUMMARY"

  draft:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Real releases run in `release`, the only environment holding the release-tagger App's
    # key (and the one crates.io trusts); it only deploys from main and v* tags. Rehearsals
    # get no environment: they tag rehearsal/... with the built-in token.
    environment: ${{ needs.plan.outputs.rehearsal != 'true' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: tagger
        if: needs.plan.outputs.rehearsal != 'true'
        name: release-tagger token (the only identity allowed to create v* tags)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}
          permission-contents: write
      - name: tag this commit
        env:
          GH_TOKEN: ${{ steps.tagger.outputs.token || github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha 2>/dev/null); then
            [[ "$sha" == "$GITHUB_SHA" ]] || { echo "::error::$TAG exists at $sha, not $GITHUB_SHA"; exit 1; }
            echo "$TAG already points here (resuming)"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" -q .ref
          fi
      - name: release notes from CHANGELOG.md
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "_No CHANGELOG.md entry for $VERSION._" > notes.md
          asset="$NAME-x86_64-unknown-linux-musl"
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          cargo install $NAME --version $VERSION --locked
          cargo binstall $NAME@$VERSION   # prebuilt
          \`\`\`

          ## Verify a download

          Every asset has a \`.sha256\` file and signed build provenance (Sigstore, via GitHub
          artifact attestations) tying it to this repository, the release workflow and commit
          $GITHUB_SHA.

          \`\`\`sh
          gh release download $TAG -R $GITHUB_REPOSITORY -p '$asset.*'
          sha256sum -c $asset.sha256
          gh attestation verify $asset.tar.gz -R $GITHUB_REPOSITORY
          \`\`\`

          The \`.crate\` attached here is byte-for-byte the file on crates.io; the release
          workflow checked that before publishing this page.
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.tag }}
          draft: true
          prerelease: ${{ needs.plan.outputs.rehearsal == 'true' || needs.plan.outputs.prerelease == 'true' }}
          body_path: notes.md

  build:
    needs: [plan, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, so they don't depend on the runner's glibc.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload to the draft
      id-token: write # sign the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - id: dist
        name: build, archive, checksum
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: spin-life
          target: ${{ matrix.target }}
          locked: true
          build-tool: cargo # pure Rust: no need for cross/Docker, even for musl
          checksum: sha256
          dry-run: true # attest before uploading; softprops does the upload
          dry-run-intended: true
      - name: build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.dist.outputs.tar || steps.dist.outputs.zip }}
      # Upload only. Updating the release (what action-gh-release does on every call) is
      # refused once the branch has moved past the drafted commit.
      - name: upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ARCHIVE: ${{ steps.dist.outputs.tar || steps.dist.outputs.zip }}
          SUM: ${{ steps.dist.outputs.sha256 }}
        run: gh release upload "$TAG" "$ARCHIVE" "$SUM" --clobber -R "$GITHUB_REPOSITORY"

  crate:
    needs: [plan, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: pack
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cargo package --locked
          file="$NAME-$VERSION.crate"
          cp "target/package/$file" .
          sha256sum "$file" | tee "$file.sha256"
          { echo "file=$file"; echo "sha256=$(cut -d' ' -f1 "$file.sha256")"; } >>"$GITHUB_OUTPUT"
      - name: build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber -R "$GITHUB_REPOSITORY"

  test:
    name: test ${{ matrix.target }} (from the draft)
    needs: [plan, build, crate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # reading a *draft* release needs push access
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      ASSET: spin-life-${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/golden
            .github/release
      - name: download from the draft release
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET.*"
          ls -l
      - name: verify checksum
        working-directory: dl
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c "$ASSET.sha256"; else shasum -a 256 -c "$ASSET.sha256"; fi
      - name: verify provenance
        working-directory: dl
        run: |
          gh attestation verify "$ASSET.$EXT" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: unpack
        working-directory: dl
        run: |
          if [[ "$EXT" == zip ]]; then unzip -o "$ASSET.zip"; else tar xzf "$ASSET.tar.gz"; fi
      - name: statically linked
        if: runner.os == 'Linux'
        run: |
          file dl/spin-life
          file dl/spin-life | grep -Eq 'static(ally|-pie) linked'
      - name: smoke test
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          exe=""; [[ "$TARGET" == *windows* ]] && exe=".exe"
          .github/release/smoke.sh "dl/spin-life$exe" "$VERSION" tests/golden

  publish:
    needs: [plan, crate, test]
    runs-on: ubuntu-latest
    # Must match the environment on crates.io's trusted publisher. Rehearsals only dry-run,
    # so they need no environment (and required reviewers on `release` never block them).
    environment: ${{ needs.plan.outputs.rehearsal != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # trusted publishing: GitHub OIDC token -> short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: the bytes we upload are the bytes we attested
        env:
          WANT: ${{ needs.crate.outputs.sha256 }}
          FILE: ${{ needs.crate.outputs.file }}
        run: |
          cargo package --locked
          got=$(sha256sum "target/package/$FILE" | cut -d' ' -f1)
          echo "attested $WANT"; echo "packaged $got"
          [[ "$got" == "$WANT" ]] || { echo "::error::cargo package is not reproducible here; refusing to publish"; exit 1; }
      - name: already on crates.io (resuming)
        if: needs.plan.outputs.rehearsal != 'true' && needs.plan.outputs.published == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "::notice::$VERSION is already on crates.io; verifying it instead of publishing again"
      - name: rehearsal (dry run)
        if: needs.plan.outputs.rehearsal == 'true'
        run: cargo publish --locked --dry-run
      - name: trusted publishing
        id: auth
        if: needs.plan.outputs.rehearsal != 'true' && needs.plan.outputs.published != 'true'
        continue-on-error: true # the very first release uses CARGO_REGISTRY_TOKEN instead
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish
        if: needs.plan.outputs.rehearsal != 'true' && needs.plan.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::no crates.io credentials. Configure trusted publishing on crates.io (see README > Releasing), or for the first release add a CARGO_REGISTRY_TOKEN secret to the 'release' environment. Then re-run the failed jobs: the draft is still waiting."
            exit 1
          fi
          cargo publish --locked

  verify:
    needs: [plan, crate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # reading the draft
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.plan.outputs.name }}
      VERSION: ${{ needs.plan.outputs.version }}
      WANT: ${{ needs.crate.outputs.sha256 }}
      FILE: ${{ needs.crate.outputs.file }}
      REHEARSAL: ${{ needs.plan.outputs.rehearsal }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: get the .crate
        run: |
          mkdir dl && cd dl
          if [[ "$REHEARSAL" == true ]]; then
            echo "rehearsal: checking the draft's .crate instead of crates.io"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$FILE"
            exit 0
          fi
          index="https://index.crates.io/${NAME:0:2}/${NAME:2:2}/$NAME"
          for i in $(seq 1 60); do
            cksum=$(curl -fsS "$index" 2>/dev/null | jq -r --arg v "$VERSION" 'select(.vers == $v) | .cksum' || true)
            [[ -n "$cksum" ]] && break
            echo "waiting for crates.io's index ($i)"; sleep 10
          done
          [[ -n "$cksum" ]] || { echo "::error::$NAME $VERSION never appeared in the crates.io index"; exit 1; }
          echo "index checksum $cksum"
          [[ "$cksum" == "$WANT" ]] || { echo "::error::crates.io index checksum differs from the attested .crate"; exit 1; }
          curl -fsSL -o "$FILE" "https://static.crates.io/crates/$NAME/$FILE"
      - name: same bytes as attested
        working-directory: dl
        run: |
          got=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "attested $WANT"; echo "fetched  $got"
          [[ "$got" == "$WANT" ]] || { echo "::error::the .crate differs from the attested one"; exit 1; }
      - name: provenance verifies on the published file
        working-directory: dl
        run: |
          gh attestation verify "$FILE" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: env.REHEARSAL != 'true'
        with:
          toolchain: stable
      - name: cargo install from crates.io
        if: env.REHEARSAL != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            cargo install "$NAME" --version "$VERSION" --locked --root "$RUNNER_TEMP/from-crates-io" && break
            echo "attempt $attempt failed; retrying in 30s"; sleep 30
          done
          "$RUNNER_TEMP/from-crates-io/bin/spin-life" --version | grep -Fx "spin-life $VERSION"

  release:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # start release-plz afterwards
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: publish the release
        if: needs.plan.outputs.rehearsal != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          draft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'true' }}
      - name: start release-plz for anything merged while this ran
        if: needs.plan.outputs.rehearsal != 'true'
        run: gh workflow run release-plz.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: rehearsal over, delete its tag and draft (and any left by failed rehearsals)
        if: needs.plan.outputs.rehearsal == 'true'
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("rehearsal/"))) | .tagName' |
            while read -r tag; do gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes; echo "deleted draft $tag"; done
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/rehearsal/" -q '.[].ref' |
            while read -r ref; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref"; echo "deleted $ref"; done
