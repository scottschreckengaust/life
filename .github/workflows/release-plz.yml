name: release-plz

# Keeps one release PR open: the version bump and CHANGELOG.md entry for everything merged
# since the last release. Merging that PR is what cuts a release (release.yml does the rest);
# release-cut.yml merges it for you after 6 quiet hours.
#
# Runs as the release-bot App (key in the `bot` environment, which only deploys from main).
# A PR the App opens or updates starts CI like anyone's, so its checks count as a ruleset's
# required status checks (CI dispatched by GITHUB_TOKEN doesn't).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  release-pr:
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    environment: bot
    permissions:
      contents: read # checkout; the App's token does the writing
    steps:
      - id: bot
        name: release-bot token (commits the bump, opens and updates the release PR)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: release-plz
        name: open or update the release PR
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
