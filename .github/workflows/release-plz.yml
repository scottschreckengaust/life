name: release-plz

# Keeps one release PR open: the version bump and CHANGELOG.md entry for everything merged
# since the last release. Merging that PR is what cuts a release (release.yml does the rest);
# release-cut.yml merges it for you after 6 quiet hours.
#
# Runs as github-actions[bot] with the built-in GITHUB_TOKEN. PRs made with that token don't
# trigger CI by themselves, so this starts CI on the release PR explicitly.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump to the release branch
      pull-requests: write # open and update the release PR
      actions: write # start CI on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: release-plz
        name: open or update the release PR
        uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: start CI on the release PR
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != '{}'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
