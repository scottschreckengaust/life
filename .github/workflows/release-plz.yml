name: release-plz

# Keeps one release PR open: the version bump and CHANGELOG.md entry for everything merged
# since the last release. Merging that PR is what cuts a release (release.yml does the rest);
# release-cut.yml merges it for you after 6 quiet hours.
#
# Needs a credential that isn't the default GITHUB_TOKEN, because PRs and pushes made with
# that token don't trigger CI or release.yml. See README > Releasing > One-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: token
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::no release credential yet (README > Releasing > One-time setup); skipping"
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.token.outputs.ok == 'true'
        with:
          toolchain: stable
      - name: open or update the release PR
        if: steps.token.outputs.ok == 'true'
        uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_PLZ_TOKEN }}
