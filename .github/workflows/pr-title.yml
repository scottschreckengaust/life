name: pr-title

# PRs are squash-merged, so the title becomes the commit message that release-plz reads.
# It must be a Conventional Commit: feat: / fix: / docs: / ci: / chore: ..., with ! for
# breaking changes (feat!: ...).

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads the title only; never checks out the PR's code
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A crate change under a type that never releases ships nothing: #30 fixed two bugs as
      # `test:` and they sat unreleased. src/ changes need feat/fix/perf/refactor/docs/style.
      - name: a src/ change has a type that matches it
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          type=$(sed -nE 's/^([a-z]+)(\(.*\))?!?:.*/\1/p' <<<"$TITLE")
          case "$type" in test|ci|chore|build) ;; *) exit 0 ;; esac
          src=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename | select(startswith("src/"))')
          [[ -z "$src" ]] && exit 0
          echo "::error::'$type:' never releases, but this PR changes the crate's code:"
          echo "$src"
          echo "Retitle it fix:/feat:/perf:/refactor: (or split the src/ change out) so release-plz sees it."
          exit 1
