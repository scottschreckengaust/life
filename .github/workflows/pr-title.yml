name: pr-title

# PRs are squash-merged, so the title becomes the commit message that release-plz reads.
# It must be a Conventional Commit: feat: / fix: / docs: / ci: / chore: ..., with ! for
# breaking changes (feat!: ...).

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads the title only; never checks out the PR's code
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
