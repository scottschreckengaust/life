name: rehearse-reminder

# A PR that changes the release machinery gets one comment saying to rehearse it before
# merging (README > Releasing > Rehearsals). CI can't catch a broken release: only running
# the pipeline does.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads the PR's file list only; never checks out the PR's code
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-cut.yml
      - .github/workflows/release-plz.yml
      - .github/release/**
      - release-plz.toml
      - Cargo.toml

permissions: {}

jobs:
  remind:
    # One run per PR at a time, so a quick opened + synchronize can't post twice.
    concurrency:
      group: rehearse-reminder-${{ github.event.pull_request.number }}
    # Release PRs only bump the version, and the release itself is their rehearsal.
    if: github.repository_owner == 'scottschreckengaust' && !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # one comment
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: comment once
        shell: bash # -o pipefail: a failed API call fails the step instead of looking like "nothing to do"
        run: |
          marker='<!-- rehearse-reminder -->'
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            echo "already reminded"
            exit 0
          fi
          all=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          # File names come from the PR (maybe a fork): only plain path characters get into the comment.
          files=$(grep -E '^(\.github/workflows/release(-cut|-plz)?\.yml|\.github/release/[A-Za-z0-9._/-]+|release-plz\.toml|Cargo\.toml)$' <<<"$all" |
            sed 's/^/- /' || true)
          [[ -n "$files" ]] || { echo "no release files changed"; exit 0; }
          body="$marker
          ### 🎭 This PR changes the release machinery

          $files

          CI doesn't run the release pipeline, so **rehearse before merging**: push this branch to a \`release/**\` branch,
          for example

          \`\`\`sh
          git push origin HEAD:release/rehearse-$PR
          \`\`\`

          and check that [\`release.yml\`](https://github.com/$REPO/actions/workflows/release.yml) goes green: a real \`rehearsal/…\` tag, all builds
          with provenance, the downloaded binaries tested on every OS, and \`cargo publish --dry-run\`. It cleans up after
          itself; delete the branch afterwards.

          A rehearsal can't check the release-tagger App (run **release-cut** with \`check_tagger\`) or crates.io trusted
          publishing (only a real release proves it). See README › Releasing › Rehearsals."
          gh pr comment "$PR" -R "$REPO" --body "$body"
