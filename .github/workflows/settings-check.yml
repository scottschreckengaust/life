name: settings-check

# Run by hand to prove two repository settings by behaviour, since reading them needs an
# admin token no workflow has. Settings > Actions > General:
#
#   - Workflow permissions: "Read repository contents and packages permissions"
#     A job that declares no permissions gets the repo's default token; a write with it
#     must be refused.
#   - "Allow GitHub Actions to create and approve pull requests" unticked
#     A job granted pull-requests: write must still be refused when it opens a PR.
#
# The third #24 setting (approval for all external contributors' fork PRs) can't be probed
# from here; it's checked by eye.
#
# No `permissions:` at the top or on `default-token`, on purpose: that job must get the
# repository default to test it.

on:
  workflow_dispatch:

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  default-token: # zizmor: ignore[excessive-permissions] must run with the repository's default token, which is what it tests
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    steps:
      - name: the default token can't write
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: settings-check-${{ github.run_id }}
        run: |
          if gh api -X POST "repos/$REPO/labels" -f name="$LABEL" -f color=ededed >/dev/null 2>err.txt; then
            gh api -X DELETE "repos/$REPO/labels/$LABEL" || true
            echo "::error::the default workflow token could create a label: set Workflow permissions to read-only"
            exit 1
          fi
          grep -q 'Resource not accessible by integration' err.txt || { cat err.txt; echo "::error::refused, but not for lack of permission"; exit 1; }
          echo "::notice::default workflow permissions are read-only"
          echo "- ✅ default workflow token is read-only" >>"$GITHUB_STEP_SUMMARY"

  no-actions-prs:
    if: github.repository_owner == 'scottschreckengaust'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # granted, so only the repository setting can refuse it
    steps:
      - name: GitHub Actions can't open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # main into main: if the setting allowed it, this would fail later on "no commits".
          if out=$(gh api -X POST "repos/$REPO/pulls" -f head=main -f base=main -f title="settings-check" 2>&1); then
            echo "::error::GitHub Actions opened a pull request: $out"
            exit 1
          fi
          if grep -q 'not permitted to create or approve pull requests' <<<"$out"; then
            echo "::notice::GitHub Actions can't create or approve pull requests"
            echo "- ✅ GitHub Actions can't create or approve pull requests" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "$out"
            echo "::error::not refused by the setting: untick 'Allow GitHub Actions to create and approve pull requests'"
            exit 1
          fi
