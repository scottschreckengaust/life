name: fuzz

# libFuzzer, through cargo-fuzz, on the parsers and the engine (fuzz/): a short run on
# every PR that touches them, a long one weekly. A crash fails the run, and its input is
# printed (base64) in the annotations and kept as an artifact, so it can become a test.

on:
  pull_request:
    paths: ["src/**", "fuzz/**", "Cargo.toml", ".github/workflows/fuzz.yml"]
  push:
    branches: [main]
    paths: ["src/**", "fuzz/**", "Cargo.toml", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "37 4 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "600"

permissions:
  contents: read

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

env:
  # libFuzzer's instrumentation needs nightly; pinned, like everything else.
  NIGHTLY: nightly-2026-10-15
  CARGO_FUZZ: "0.13.2"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toml, iso, life]
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '900') || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: cargo-fuzz ${{ env.CARGO_FUZZ }}
        run: cargo +"$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: fuzz/Cargo.lock is committed and current
        run: |
          if [[ ! -f fuzz/Cargo.lock ]]; then
            cargo +"$NIGHTLY" generate-lockfile --manifest-path fuzz/Cargo.toml
            lock=$(sed 's/%/%25/g' fuzz/Cargo.lock | awk '{printf "%s%%0A", $0}')
            echo "::error title=fuzz/Cargo.lock is missing::commit this as fuzz/Cargo.lock:%0A$lock"
            exit 1
          fi
          cargo +"$NIGHTLY" metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null
      - name: fuzz ${{ matrix.target }} for ${{ env.SECONDS_PER_TARGET }}s
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo +"$NIGHTLY" fuzz run "$TARGET" "$RUNNER_TEMP/corpus" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10
      - name: print the crashing input
        if: failure()
        run: |
          shopt -s nullglob
          for f in fuzz/artifacts/"$TARGET"/*; do
            echo "::error title=fuzz $TARGET: $(basename "$f")::$(base64 -w0 "$f" | head -c 3000)"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          retention-days: 30
