name: fuzz

# libFuzzer, through cargo-fuzz, on the parsers and the engine (fuzz/): a short run on
# every PR that touches them, a long one weekly. A crash fails the run, and its input is
# printed (gzip+base64, in pieces) in the annotations and kept as an artifact, so it can become a test.

on:
  pull_request:
    paths: ["src/**", "fuzz/**", "Cargo.toml", ".github/workflows/fuzz.yml"]
  push:
    branches: [main]
    paths: ["src/**", "fuzz/**", "Cargo.toml", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "37 4 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "600"

permissions: {}

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

env:
  # libFuzzer's instrumentation needs nightly; pinned, like everything else.
  NIGHTLY: nightly-2026-10-15
  CARGO_FUZZ: "0.13.2"

jobs:
  fuzz:
    permissions:
      contents: read
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toml, iso, life]
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '900') || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: cargo-fuzz ${{ env.CARGO_FUZZ }}
        run: cargo +"$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: fuzz/Cargo.lock is committed and current
        run: |
          if [[ ! -f fuzz/Cargo.lock ]]; then
            cargo +"$NIGHTLY" generate-lockfile --manifest-path fuzz/Cargo.toml
            lock=$(sed 's/%/%25/g' fuzz/Cargo.lock | awk '{printf "%s%%0A", $0}')
            echo "::error title=fuzz/Cargo.lock is missing::commit this as fuzz/Cargo.lock:%0A$lock"
            exit 1
          fi
          # spin-life itself is a path dependency whose version moves with every release:
          # refresh only that entry, then everything from crates.io must match the lock.
          cargo +"$NIGHTLY" update --manifest-path fuzz/Cargo.toml -p spin-life
          cargo +"$NIGHTLY" metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null
      - name: fuzz ${{ matrix.target }} for ${{ env.SECONDS_PER_TARGET }}s
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          # Symbolized stacks ("in spin_life::...", not bare addresses), when the runner has LLVM.
          sym=""
          for s in /usr/lib/llvm-*/bin/llvm-symbolizer; do if [[ -x "$s" ]]; then sym=$s; fi; done
          if [[ -n "$sym" ]]; then
            ASAN_SYMBOLIZER_PATH=$sym PATH="${sym%/*}:$PATH"
            export ASAN_SYMBOLIZER_PATH PATH
          fi
          cargo +"$NIGHTLY" fuzz run "$TARGET" "$RUNNER_TEMP/corpus" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10 \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - name: print the crashing input
        if: failure()
        run: |
          shopt -s nullglob
          # Why it crashed: the panic message or sanitizer report, which run logs only keep as
          # long as the run does. Annotations are readable without downloading anything.
          why=$(grep -E -A12 "panicked at|ERROR: (AddressSanitizer|libFuzzer)|SUMMARY:" "$RUNNER_TEMP/fuzz.log" \
            | head -n 40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=fuzz $TARGET: why::${why:-no panic or sanitizer report in the log}"
          # The whole input, gzipped and base64'd, in pieces small enough for an annotation:
          #   cat piece1 piece2 ... | base64 -d | gunzip > input
          for f in fuzz/artifacts/"$TARGET"/*; do
            { gzip -9c "$f" | base64 -w0 | fold -w 3000; echo; } > "$RUNNER_TEMP/pieces"
            n=$(wc -l < "$RUNNER_TEMP/pieces"); i=0
            while IFS= read -r piece; do
              i=$((i + 1))
              echo "::error title=fuzz $TARGET: $(basename "$f") (gzip+base64, $i of $n)::$piece"
            done < "$RUNNER_TEMP/pieces"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          retention-days: 30
