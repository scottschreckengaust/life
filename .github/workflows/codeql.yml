name: codeql

# CodeQL, advanced setup (instead of default setup) so it can be re-run by hand, its check
# names are stable enough to require, and its SARIF is kept as an artifact that
# scorecard-report.yml turns into a readable check run. Rust, and the workflows themselves
# (the actions queries catch injection and token misuse). Neither needs a build.
#
# Needs: Security > Code scanning > CodeQL analysis set to Advanced (default setup off),
# or uploads from here are rejected.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 2" # Tuesdays
  workflow_dispatch:

permissions: {}

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results (read-only on fork PRs: then the upload is skipped)
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: sarif
          upload: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
      # The raw results, downloadable from the run (the Security tab needs a browser login).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif/
          retention-days: 30
