name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail, so a failure inside a pipeline fails the step (GitHub's default shell
# has no pipefail). Enforced by .github/ci/check-workflows.sh.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: for f in presets/*.toml; do cargo run -q --release -- check "$f"; done
      - name: release scripts' tests
        run: |
          bash .github/release/test-version-is-new.sh
          bash .github/release/test-plan.sh
          bash .github/ci/check-workflows.sh
      - name: --format json parses as JSON
        run: cargo run -q --release -- chaos -i -f json | jq -e '(.days | length) == 7 and (.activities | length) == 9'
      - run: cargo package --locked
      - name: cargo package is reproducible (the release workflow relies on it)
        run: |
          a=$(sha256sum target/package/*.crate | cut -d' ' -f1)
          rm -rf target/package && touch src/*.rs && cargo package --locked -q
          b=$(sha256sum target/package/*.crate | cut -d' ' -f1)
          echo "$a"; echo "$b"; [ "$a" = "$b" ]

  # On the release PR: the version it would cut must not exist anywhere yet (crates.io,
  # including yanked versions, a tag, or a GitHub release). release-cut checks again right
  # before merging; this check makes a doomed release PR red as soon as it's opened.
  version-is-new:
    if: startsWith(github.head_ref || github.ref_name, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          .github/release/version-is-new.sh "$(jq -r '.packages[0].name' <<<"$meta")" "$(jq -r '.packages[0].version' <<<"$meta")"

  # Every line in src/ runs under the tests, the CLI included (the tests run the
  # real binary). Uncovered lines show up as annotations, one per file.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - name: 100% of lines
        run: python3 .github/coverage/check.py lcov.info

  # The public API against the last release. An unmarked break fails here, on the PR,
  # instead of surfacing as a surprise major bump on the release PR (#30 quietly made
  # Life !Send). A deliberate break is fine: mark the title feat!: / fix!:.
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo semver-checks against the last release
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "::notice::baseline $base"
          cargo semver-checks --baseline-rev "$base" 2>&1 | tee semver.log && exit 0
          # It exits 1 for a break and for its own errors; only a reported break may be waved
          # through by the title.
          if ! grep -q '^--- failure ' semver.log; then
            echo "::error::cargo semver-checks failed without reporting a break (see above)"
            exit 1
          fi
          if [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            echo "::notice::breaking change, and the title says so"
            exit 0
          fi
          echo "::error::this breaks the public API since $base (see above). Fix it, or mark the title feat!:/fix!: and push again (CI doesn't re-run on a title edit)."
          exit 1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.70"
      - run: cargo test --locked

  # Security lint for the workflows: dangerous triggers, template injection, over-broad
  # permissions, unpinned or impostor actions, persisted credentials. Findings fail the job and
  # show as annotations; a deliberate exception needs `# zizmor: ignore[<audit>] <why>` inline.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # online audits: impostor commits, known-vulnerable actions
          ZIZMOR: "1.31.1"
        run: pipx run "zizmor==$ZIZMOR" --format github .

  # The same audit on main, uploaded to Security > Code scanning, so findings are tracked
  # over time and not only shown on the PR that introduced them. Exits 0: the gate is the
  # zizmor job above; this only records.
  zizmor-sarif:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (SARIF)
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR: "1.31.1"
        run: pipx run "zizmor==$ZIZMOR" --format sarif --no-exit-codes . >zizmor.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (findings show up as annotations on the PR)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 2>&1 | tail -3
          out=$(./actionlint -oneline 2>&1) && exit 0
          echo "$out"
          while IFS= read -r line; do echo "::error::$line"; done <<<"$out"
          exit 1

  # Mutation testing (https://mutants.rs): cargo-mutants makes small changes to the code (`<` to
  # `<=`, a body replaced with a default) and runs the tests against each one. A mutant every
  # test still passes ("missed") is a gap in the tests. A PR mutates only the lines it changes;
  # main gets everything, sharded (mutants-full). Survivors show up as annotations, one per
  # file, listing each one. Configuration: .cargo/mutants.toml.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch, to diff against
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: mutate the lines this PR changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # A mutant that loops forever writing the diary would eat the runner's memory before
          # its timeout; capped at 2 GiB a process, it fails to allocate and is caught instead.
          ulimit -v 2097152
          git diff "origin/$BASE...HEAD" > pr.diff
          code=0
          cargo mutants --test-tool cargo --in-diff pr.diff || code=$?
          python3 .github/mutants/report.py mutants.out "$code"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

  mutants-full:
    if: github.event_name != 'pull_request'
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      # Round-robin, so the slow mutants (the runtime's, which time out) spread over the shards.
      - name: mutate everything in this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -v 2097152 # see the mutants job
          code=0
          cargo mutants --test-tool cargo --shard "$SHARD/8" --sharding round-robin || code=$?
          python3 .github/mutants/report.py mutants.out "$code"
      - name: if the run itself died, which mutant was it on
        if: failure()
        run: |
          last=$(find mutants.out/log -type f -printf '%T@ %f\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2 || true)
          echo "::error title=mutants: last log::${last:-none}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
