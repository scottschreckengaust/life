# Keeps the commit-pinned actions and the pinned Rust current: PRs titled "ci: bump ..." so
# they pass the PR-title check and never cut a release by themselves.
# A release must be a week old before Dependabot proposes it, so a compromised release has
# time to be noticed and pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # The Rust in rust-toolchain.toml (#97): a PR when a new stable is a week old. It's where a
  # new Rust shows what it changes (clippy's new lints, coverage's line counting), so fix
  # what it reports in the same PR. It touches the release toolchain: rehearse before merging.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  # The fuzz crate's dev-only dependencies (libfuzzer-sys and what it pulls in).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  # Zero dependencies today; this is here so a future dependency gets watched too.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: ci
