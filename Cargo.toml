[package]
name = "spin-life"
version = "0.2.4"
edition = "2021"
rust-version = "1.70"
description = "Simulate a life from rules you write: priorities, preemption, interruptions and sleep, on a zero-dependency virtual-time async runtime."
authors = ["Scott Schreckengaust"]
license = "MIT"
repository = "https://github.com/scottschreckengaust/life"
homepage = "https://github.com/scottschreckengaust/life"
documentation = "https://docs.rs/spin-life"
readme = "README.md"
keywords = ["simulation", "async", "virtual-time", "scheduling", "life"]
categories = ["simulation", "asynchronous", "command-line-utilities"]
exclude = [".cargo/", ".github/", "deny.toml", "fuzz/", "release-plz.toml"]

# Zero dependencies: the runtime, select!, join!, the alarm and the config parser are all in here.
[dependencies]

[lib]
name = "spin_life"

[[bin]]
name = "spin-life"
path = "src/main.rs"

# cargo binstall spin-life: download the release asset instead of compiling.
# Names match taiki-e/upload-rust-binary-action's defaults ($bin-$target).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# Linux binaries are static (musl) so they run on any distribution; serve them to gnu hosts too.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

# What cargo-mutants builds each mutant with (.cargo/mutants.toml): the test profile without
# debug info, so the many test binaries link faster.
[profile.mutants]
inherits = "test"
debug = 0

# The clippy ratchet (#57): pedantic and nursery lints, turned on a stage at a time and never
# off again. CI runs clippy with -D warnings, so each of these is an error there.
# (MSRV 1.70's Cargo ignores this table with a warning; clippy runs on stable.)
[lints.clippy]
# Stage 1: mechanical, no behaviour change.
bool_to_int_with_if = "warn"
cast_lossless = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
enum_glob_use = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
needless_for_each = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
derive_partial_eq_without_eq = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
# Stage 2: API surface, attributes and docs only (no breaking changes).
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_const_for_fn = "warn"
too_long_first_doc_paragraph = "warn"
